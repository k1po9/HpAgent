name: CI

on:
  pull_request:
  push:
    branches: [main, master, feat/hpagent-web]

jobs:
  phase-a:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hpagent_migrate
          POSTGRES_PASSWORD: hpagent_migrate
          POSTGRES_DB: hpagent
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hpagent_migrate -d hpagent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_DATABASE_URL: postgresql://hpagent_migrate:hpagent_migrate@localhost:5432/hpagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint typecheck
      - name: Empty database migration smoke test
        run: PYTHONPATH=src python -m persistence.migrate
      - name: Phase A PostgreSQL contract suite
        run: PYTHONPATH=src python -m pytest -m postgres test/web_persistence --junitxml=test-results/phase-a.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-a-test-results
          path: test-results/
