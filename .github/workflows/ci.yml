name: CI

on:
  pull_request:
  push:
    branches: [main, master, feat/hpagent-web]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint typecheck

  existing-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Existing project test suite
        run: python -m pytest -m "not postgres" test --junitxml=test-results/existing.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-test-results
          path: test-results/

  phase-a-postgres-contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hpagent_migrate
          POSTGRES_PASSWORD: hpagent_migrate
          POSTGRES_DB: hpagent
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hpagent_migrate -d hpagent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://hpagent_migrate:hpagent_migrate@localhost:5432/hpagent
      APP_DATABASE_URL: postgresql://hpagent_api:hpagent_api@localhost:5432/hpagent
      WORKER_DATABASE_URL: postgresql://hpagent_worker:hpagent_worker@localhost:5432/hpagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Empty database migration smoke test
        run: PYTHONPATH=src APP_DATABASE_URL=$MIGRATION_DATABASE_URL python -m persistence.migrate
      - name: Configure test runtime role passwords
        env:
          PGPASSWORD: hpagent_migrate
        run: |
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_api PASSWORD 'hpagent_api'"
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_worker PASSWORD 'hpagent_worker'"
      - name: Phase A PostgreSQL contract suite
        run: PYTHONPATH=src python -m pytest -m postgres test/web_persistence --junitxml=test-results/phase-a.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-a-test-results
          path: test-results/

  phase-b-api-contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hpagent_migrate
          POSTGRES_PASSWORD: hpagent_migrate
          POSTGRES_DB: hpagent
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hpagent_migrate -d hpagent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://hpagent_migrate:hpagent_migrate@localhost:5432/hpagent
      APP_DATABASE_URL: postgresql://hpagent_api:hpagent_api@localhost:5432/hpagent
      WORKER_DATABASE_URL: postgresql://hpagent_worker:hpagent_worker@localhost:5432/hpagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Empty database migration
        run: PYTHONPATH=src APP_DATABASE_URL=$MIGRATION_DATABASE_URL python -m persistence.migrate
      - name: Configure runtime role passwords
        env:
          PGPASSWORD: hpagent_migrate
        run: |
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_api PASSWORD 'hpagent_api'"
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_worker PASSWORD 'hpagent_worker'"
      - name: Phase B API contract suite
        run: PYTHONPATH=src python -m pytest -m postgres test/web_api --junitxml=test-results/phase-b.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b-test-results
          path: test-results/

  phase-c-isolation-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hpagent_migrate
          POSTGRES_PASSWORD: hpagent_migrate
          POSTGRES_DB: hpagent
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hpagent_migrate -d hpagent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://hpagent_migrate:hpagent_migrate@localhost:5432/hpagent
      APP_DATABASE_URL: postgresql://hpagent_api:hpagent_api@localhost:5432/hpagent
      WORKER_DATABASE_URL: postgresql://hpagent_worker:hpagent_worker@localhost:5432/hpagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Empty database migration
        run: PYTHONPATH=src APP_DATABASE_URL=$MIGRATION_DATABASE_URL python -m persistence.migrate
      - name: Configure runtime role passwords
        env:
          PGPASSWORD: hpagent_migrate
        run: |
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_api PASSWORD 'hpagent_api'"
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_worker PASSWORD 'hpagent_worker'"
      - name: Phase C session and context isolation tests
        run: PYTHONPATH=src python -m pytest -m postgres test/web_persistence/test_phase_c_sessions.py test/web_persistence/test_phase_c_context.py --junitxml=test-results/phase-c-postgres.xml
      - name: Phase C workspace isolation tests
        run: PYTHONPATH=.:src python -m pytest test/test_context_assembly.py test/test_workspace_isolation.py --junitxml=test-results/phase-c-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-c-test-results
          path: test-results/

  phase-d-temporal-fault-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hpagent_migrate
          POSTGRES_PASSWORD: hpagent_migrate
          POSTGRES_DB: hpagent
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hpagent_migrate -d hpagent"
          --health-interval 5s --health-timeout 3s --health-retries 20
      temporal:
        image: temporalio/auto-setup:1.26.2
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_USER: hpagent_migrate
          POSTGRES_PWD: hpagent_migrate
          POSTGRES_SEEDS: postgres
        ports: [7233:7233]
        options: >-
          --health-cmd "tctl --address localhost:7233 cluster health"
          --health-interval 10s --health-timeout 5s --health-retries 24
    env:
      TEMPORAL_HOST: localhost:7233
      MIGRATION_DATABASE_URL: postgresql://hpagent_migrate:hpagent_migrate@localhost:5432/hpagent
      APP_DATABASE_URL: postgresql://hpagent_api:hpagent_api@localhost:5432/hpagent
      WORKER_DATABASE_URL: postgresql://hpagent_worker:hpagent_worker@localhost:5432/hpagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Empty database migration
        run: PYTHONPATH=src APP_DATABASE_URL=$MIGRATION_DATABASE_URL python -m persistence.migrate
      - name: Configure runtime role passwords
        env:
          PGPASSWORD: hpagent_migrate
        run: |
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_api PASSWORD 'hpagent_api'"
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_worker PASSWORD 'hpagent_worker'"
      - name: Phase D frozen Workflow History replay
        run: >-
          PYTHONPATH=.:src python -m pytest
          test/test_web_temporal_replay.py
          --junitxml=test-results/phase-d-replay.xml
      - name: Phase D real Temporal and fault-injection suite
        run: >-
          PYTHONPATH=.:src python -m pytest -s
          test/test_web_temporal_integration.py
          test/web_persistence/test_web_temporal_e2e.py
          test/web_persistence/test_web_temporal_lifecycle.py
          --junitxml=test-results/phase-d.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-d-test-results
          path: test-results/

  phase-e-frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: cd web && npm ci
      - name: ESLint / Prettier
        run: cd web && npm run lint
      - name: TypeScript typecheck
        run: cd web && npm run typecheck
      - name: Unit tests
        run: cd web && npm test
      - name: Production build
        run: cd web && npm run build

  phase-e-browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hpagent_migrate
          POSTGRES_PASSWORD: hpagent_migrate
          POSTGRES_DB: hpagent
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hpagent_migrate -d hpagent"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql://hpagent_migrate:hpagent_migrate@localhost:5432/hpagent
      APP_DATABASE_URL: postgresql://hpagent_api:hpagent_api@localhost:5432/hpagent
      WORKER_DATABASE_URL: postgresql://hpagent_worker:hpagent_worker@localhost:5432/hpagent
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Empty database migration
        run: PYTHONPATH=src APP_DATABASE_URL=$MIGRATION_DATABASE_URL python -m persistence.migrate
      - name: Configure test runtime role passwords
        env:
          PGPASSWORD: hpagent_migrate
        run: |
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_api PASSWORD 'hpagent_api'"
          psql -h localhost -U hpagent_migrate -d hpagent -c "ALTER ROLE hpagent_worker PASSWORD 'hpagent_worker'"
      - name: Install web dependencies
        run: cd web && npm ci
      - name: Install Playwright chromium (with system deps)
        run: cd web && npx playwright install --with-deps chromium
      - name: Phase E browser E2E (real API / PostgreSQL / Redis)
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-e-e2e-results
          path: web/test-results/
