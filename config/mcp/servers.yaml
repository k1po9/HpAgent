        enrich: " 用于地址→坐标转换（地理编码）。"
      maps_ip_location:
        hint: "（查了查IP在哪 📍）"
        enrich: " 用于IP地址归属地查询。"
      maps_around_search:
        hint: "（在地图周围找了找 🔍）"
        enrich: " 用于周边POI搜索。"
      maps_text_search:
        hint: "（在地图上搜了一下 📝）"
        enrich: " 用于关键词地点搜索。"
      maps_search_detail:
        hint: "（正在查看地图详情 🏠）"
