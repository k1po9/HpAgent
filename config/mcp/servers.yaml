# MCP Server 统一配置
# ============================================================
# 每个 server 块包含：连接参数 + 工具配置（hint / enrich）。
# 新增 MCP 服务器只需改这一个文件。
# ============================================================
#
# ── 连接字段 ─────────────────────────────────────────────
# url              str     MCP 端点 URL（HTTP/SSE 模式）
# description      str     服务描述
# headers          dict    自定义 HTTP 头，支持 ${ENV_VAR}
# request_timeout  float   请求超时秒数（默认 60）
# session_ttl      float   会话过期秒数（HTTP/SSE，默认 100）
# truncate_limit   int     工具输出截断字符数（null=不截断）
# disabled         bool    设为 true 跳过此 server
# required         bool    所有工具始终加载，不参与 RAG 过滤
# result_transform str     结果后处理变换 key（如 extract_content）
# ── stdio 传输专用 ────────────────────────────────────────
# transport        str     设为 "stdio"
# command          str     可执行文件路径（如 node / python）
# args             list    命令行参数
# env              dict    子进程环境变量（增量覆盖）
# cwd              str     子进程工作目录（默认自动指向项目根）
# ── 工具配置 ──────────────────────────────────────────────
# tools.<name>.hint    群聊进度提示（括号表示悄悄话）
# tools.<name>.enrich  追加到 LLM 工具描述的用法提示
#
# ════════════════════════════════════════════════════════

servers:

  # ── tavily 网页搜索 ──────────────────────────────────────
  tavily-mcp:
    url: "https://mcp.api-inference.modelscope.net/1cf7c250530c4e/mcp"
    description: "tavily-websearch-mcp-server"
    required: false
    tools:
      tavily-search:
        hint: "（爪子敲键盘上网冲浪中 🌊）"
        enrich: " 用于搜索网页信息。实时性较强的数据（股价、天气、新闻）请优先调用对应专业工具。"
      tavily-extract:
        hint: "（正在阅读网页内容 📖）"
        enrich: " 用于提取/阅读网页正文内容。"

  # china-stock-mcp:
  #   url: "https://mcp.api-inference.modelscope.net/3d2deab5595c41/mcp"
  #   description: "china-stock-mcp-server"

  # akshare-one-mcp:
  #   url: "https://mcp.api-inference.modelscope.net/99b6212ed95046/sse"
  #   description: "A股行情数据（历史K线/实时行情/财报/新闻/技术指标）"
  #   request_timeout: 30
  #   truncate_limit: 4000

  # ── stock-sdk 股票行情 ───────────────────────────────────
  stock-sdk:
    transport: "stdio"
    command: "node"
    args:
      - "tools/mcp/stock-sdk-runtime/node_modules/stock-sdk-mcp/dist/index.js"
    description: "国内外股票：A股/港股/美股/基金/期货/期权 行情数据"
    request_timeout: 60
    truncate_limit: 4000
    # env:
    #   STOCK_SDK_MCP_TOOLS: "core"
    tools:
      get_quotes_by_query:
        hint: "（正在查询股票行情 📈）"
        enrich: " 优先用于按名称、代码或拼音查询A股、港股、美股实时行情。"

      get_a_share_quotes:
        hint: "（正在查询A股行情 🏦）"
        enrich: " 用于已知A股代码时批量查询实时行情和估值字段。"

      get_hk_quotes:
        hint: "（正在查询港股行情 🇭🇰）"
        enrich: " 用于查询港股实时行情。"

      get_us_quotes:
        hint: "（正在查询美股行情 🇺🇸）"
        enrich: " 用于查询美股实时行情。"

      search_stock:
        hint: "（正在搜索股票代码 🔍）"
        enrich: " 名称或代码不确定时使用，支持名称、代码和拼音模糊搜索。"

      get_today_timeline:
        hint: "（正在查看当日分时走势 📉）"
        enrich: " 用于查看A股当日分时价格和成交走势。"

      get_history_kline:
        hint: "（正在读取历史K线 📊）"
        enrich: " 用于查询A股日线、周线或月线历史行情。"

      get_kline_with_indicators:
        hint: "（正在计算技术指标 🧮）"
        enrich: " 需要MA、MACD、BOLL、KDJ或RSI等技术指标时优先使用。"

      analyze_stock:
        hint: "（正在进行个股综合分析 🧐）"
        enrich: " 用于一次获取个股行情、K线、技术指标、资金流和分红信息。"

      compare_stocks:
        hint: "（正在对比多只股票 ⚖️）"
        enrich: " 用于并排比较2至10只股票的行情和指标。"

      scan_market:
        hint: "（正在按条件筛选股票 🔭）"
        enrich: " 用于根据涨跌幅、换手率、量比、市盈率等条件选股。"

      get_market_overview:
        hint: "（正在查看市场全景 🌏）"
        enrich: " 用于获取主要指数、热门行业概念和市场涨跌统计。"

      get_sector_analysis:
        hint: "（正在分析行业板块 🧭）"
        enrich: " 用于查询板块行情、K线及龙头成分股。"

  # ── TickDB 股票行情 ──────────────────────────────────────
