use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  # The official image overwrites this value from SEARXNG_SECRET.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  extra_proxy_timeout: 10
