# 模型分工表：先在 .env 维护供应商凭据/模型目录，再在这里选用途。
# 完整引用图与切换教程：docs/reference/model-routing.md
# 当前选择：fast -> SiliconFlow 高速；chat -> SiliconFlow 标准；reasoning -> SiliconFlow 旗舰。
# 三条文本链按维护者选择均使用enable_thinking=false；旧thinking块已移除，兼容性待真实验证。
# 档位名称是供应商模型目录标签，不是账户 A/B/C 权益或 access_tier。
# Research 和 HTML 成果目前共用 chat；reasoning 已注册，但无业务自动切换。
# Hindsight 是独立服务，不读取本文件；模型与质量参数在 hindsight.yaml。

# 1. 供应商连接。Secret 仅引用环境变量，禁止将真实 Key 写入本文件。
providers:
  minimax:
    base_url: "${MINIMAX_API_BASE_URL}"
    api_key: "${MINIMAX_API_KEY}"
    api_format: openai
  siliconflow:
    base_url: "${SILICONFLOW_BASE_URL}"
    api_key: "${SILICONFLOW_API_KEY}"
    api_format: openai
    # https://docs.siliconflow.cn/docs/api/chat-completions-post

# 2. 用途路由。同一链多条记录表示按顺序回退；Beta 不自动增加备用供应商。
# fast：记忆召回查询改写、上下文压缩/摘要、长工具结果摘要。
fast:
  - provider: siliconflow
    model: "${SILICONFLOW_HIGHSPEED_MODEL}"
    max_tokens: 1024
    timeout: 15.0
    extra_body:
      enable_thinking: false

# chat：Web/QQ 主对话、Agent 决策/最终回复、Research 报告、HTML 成果。
chat:
  - provider: siliconflow
    model: "${SILICONFLOW_STANDARD_MODEL}"
    max_tokens: 4096
    timeout: 30.0
    extra_body:
      enable_thinking: false

# reasoning：可显式选择的推理链；复杂问题不会因此自动走该链。
reasoning:
  - provider: siliconflow
    model: "${SILICONFLOW_FLAGSHIP_MODEL}"
    max_tokens: 4096
    timeout: 60.0
    extra_body:
      enable_thinking: false

# 3. 工具检索。与 Hindsight 共用供应商变量，但调用路径相互独立。
embedding:
  - provider: siliconflow
    model: "${SILICONFLOW_EMBEDDING_MODEL}"
    timeout: 10.0
rerank:
  provider: siliconflow
  model: "${SILICONFLOW_RERANK_MODEL}"
  timeout: 10.0
  top_n: 10

# 4. Beta 不提供图像生成；文件/图片上传不受此链关闭影响。
image: []

# ── 工具 RAG 检索配置 ──────────────────────────────────────────────
tool_rag:
  enabled: true               # 启用 RAG 动态注入（按语义检索相关工具）
  top_k: 12                    # 每轮注入的工具数量上限
  persist_path: "tools/vectors"  # ChromaDB 持久化路径

# ── MCP Server 配置 ──────────────────────────────────────────────────
mcp:
  config_path: "config/mcp/servers.yaml"
  auto_connect: false  # 白名单未确认前不连接

# ── Skills 配置 ─────────────────────────────────────────────────────
skills:
  config_path: "tools/skills/"
  enabled: false  # 白名单未确认前不加载 Skills

# ── 渠道模型参数覆盖 ──────────────────────────────────────────────
# 每个渠道可覆盖 max_tokens / timeout，缺省使用上方模型链的默认值
channel_overrides:
  onebot11:
    max_tokens: 4096
    timeout: 30.0
    stream: false
  official_qq:
    max_tokens: 4096
    timeout: 30.0
    stream: false
  console:
    max_tokens: 2048
    timeout: 60.0
    stream: false
  web:
    max_tokens: 1024
    timeout: 30.0
    stream: false
  default:
    max_tokens: 1024
    timeout: 30.0
    stream: false
