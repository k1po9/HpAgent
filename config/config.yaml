# ═══════════════════════════════════════════════════════════════════════════════
# HpAgent 配置文件
# 本文件保存部署显式选择；省略项使用 Python 配置定义的默认值。
# 来源、生效边界与旧字段迁移见 docs/reference/configuration.md。
# ═══════════════════════════════════════════════════════════════════════════════

# ── Temporal Server ──────────────────────────────────────────────────────────
temporal:
  host: "localhost:7233"

# ── Redis（可选，空 url 表示禁用） ──────────────────────────────────────────
#   容器模式：Docker Compose 通过 REDIS_URL 环境变量覆盖为 redis://redis:6379
#   宿主机调试：需改为 redis://localhost:6379（映射自 docker-compose ports）
redis:
  url: "redis://localhost:6379"

# ── 沙箱（nsjail 隔离执行） ─────────────────────────────────────────────────
sandbox:
  native_tools_enabled: true    # 本地函数工具（fs_read/write/edit/Glob/Grep/Bash）
  nsjail_enabled: false          # Nsjail OS 级隔离（仅对 Bash）

# ── 工作区 ──────────────────────────────────────────────────────────────────
workspace:
  root: ".data/workspace"

# ── Hindsight 长期记忆（可选，enabled: false 禁用） ──────────────────────────
#   容器模式：Docker Compose 通过 HINDSIGHT_URL 环境变量覆盖为 http://hindsight:8888
#   宿主机调试：使用 http://localhost:8001（映射自 docker-compose ports: 8001:8888）
hindsight:
  enabled: true
  recall_enabled: false  # 完成切换检查后显式开启；不会自动迁移或清除旧数据。
  base_url: "http://localhost:8001"
  # 质量参数：hindsight.yaml；提取/归纳/回答指令：prompts/memory.yaml。

# ── 渠道启停 ────────────────────────────────────────────────────────────────
# 在此管理渠道的启用/禁用，列表中的渠道才会启动（名称对应 ChannelType 枚举值）
# 禁用所有可选渠道请设 enabled: []；删除整个列表会使用 Python 默认渠道。
# Compose 的 HPAGENT_CHANNELS（包括空值）优先于本列表。
channels:
  enabled:
    # - official_qq
    # - web
    - onebot11
    # - console
  # OneBot 监听与回执参数省略时使用 common.onebot.OneBot11Config 默认。
  # bot 身份与 token 文件可通过 ONEBOT_EXPECTED_SELF_ID / ONEBOT_ACCESS_TOKEN_FILE 覆盖。

# ── Agent 行为参数 ──────────────────────────────────────────────────────────
agent:
  default_timezone: "Asia/Shanghai"  # IANA timezone for Agent temporal context
  max_tool_turns: 5          # 单次 agentic loop 最大工具调用轮次
  # 记忆最终数量在 hindsight.yaml 的 recall.top_n 设置。
