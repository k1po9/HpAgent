# HpAgent Web 生产网关（Phase G G-01）。
#
# 浏览器唯一入口（G-01 §6.2）。职责只有三件：
#   A. React 静态资源 + SPA fallback（try_files → /index.html）
#   B. /api + /auth 反向代理到 hpagent-api —— 保持 Frontend + API 同源，
#      消除 CORS / Cookie domain / CSRF origin 复杂度
#   C. SSE 路由必须 proxy_buffering off，禁止网关缓存导致事件延迟到达
#
# 域名解析：`hpagent-api` 是 docker-compose app-network 内的服务名。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Compose 网络内 hpagent-api 服务名。保留 keepalive 复用上游连接。
    upstream hpagent_api {
        server hpagent-api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---------- A. React 静态资源 + SPA fallback ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Vite 产出带 hash 的资源不可变，长缓存。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---------- B. /api 反向代理（同源） ----------
        location /api/ {
            proxy_pass http://hpagent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- B'. /auth（登录 303 + Set-Cookie） ----------
        location /auth {
            proxy_pass http://hpagent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- C. SSE 实时流（G-01 §6.2.C） ----------
        # 覆盖 /api/v1/runs/{run_id}/events 及同前缀的 Run 资源。
        # 必须禁 buffer，否则 Agent 已产生的事件会被 Nginx 缓存，
        # 浏览器几十秒后才一次性收到。
        location /api/v1/runs/ {
            proxy_pass http://hpagent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }
    }
}
