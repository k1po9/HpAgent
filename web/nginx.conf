# HpAgent Web 生产网关（Phase G G-01）。
#
# 浏览器唯一入口（G-01 §6.2）。职责只有三件：
#   A. React 静态资源 + SPA fallback（try_files → /index.html）
#   B. /api + /auth 反向代理到 hpagent-api —— 保持 Frontend + API 同源，
#      消除 CORS / Cookie domain / CSRF origin 复杂度
#   C. SSE 路由必须 proxy_buffering off，禁止网关缓存导致事件延迟到达
#
# 域名解析：`hpagent-api` 是 docker-compose app-network 内的服务名。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # 静态资源压缩，只在下方静态 location 开启，API 与 SSE 不受影响。
    # 公网入口经窄链路反代到这里，故需接受 HTTP/1.0 与带 Via 的代理请求。
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_http_version 1.0;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/css application/javascript image/vnd.radiance;

    # Compose 网络内 hpagent-api 服务名。保留 keepalive 复用上游连接。
    upstream hpagent_api {
        server hpagent-api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;
        # One raw PUT per file; API enforces the same 32 MiB boundary.
        client_max_body_size 32m;

        # ---------- A. React 静态资源 + SPA fallback ----------
        location / {
            gzip on;
            try_files $uri $uri/ /index.html;
        }

        # Vite 产出带 hash 的资源不可变，长缓存。
        location /assets/ {
            gzip on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 认证页资源文件名不带 hash：可缓存，但过期后靠 ETag 重新校验。
        location /identity/ {
            gzip on;
            types {
                image/vnd.radiance hdr;
                image/png          png;
                font/woff2         woff2;
                text/plain         txt;
            }
            expires 7d;
            try_files $uri =404;
        }

        # ---------- B. /api 反向代理（同源） ----------
        # Both Run and Work SSE routes use these settings.
        location /api/ {
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
            proxy_pass http://hpagent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
        }

        # ---------- B'. /auth（登录 303 + Set-Cookie） ----------
        location /auth {
            proxy_pass http://hpagent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
        }

        # ---------- C. SSE 实时流（G-01 §6.2.C） ----------
        # 覆盖 /api/v1/runs/{run_id}/events 及同前缀的 Run 资源。
        # 必须禁 buffer，否则 Agent 已产生的事件会被 Nginx 缓存，
        # 浏览器几十秒后才一次性收到。
        location /api/v1/runs/ {
            proxy_pass http://hpagent_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }
    }
}
