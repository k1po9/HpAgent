# Dedicated three-role application DB for memory readiness/snapshot regressions.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: hpagent_migration
      POSTGRES_PASSWORD: fixture-only
      POSTGRES_DB: hpagent_pgroonga_test
    ports: ['127.0.0.1:15435:5432']
    volumes:
      - app-pgdata:/var/lib/postgresql/data
      - ./application-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hpagent_migration -d hpagent_pgroonga_test]
      interval: 1s
      retries: 45
    networks: [isolated]
volumes:
  app-pgdata:
networks:
  isolated:
    internal: true
