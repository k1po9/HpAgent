# P4 synthetic-only services. No business network, volume, env file or public port.
services:
  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    networks: [isolated]
  temporal-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: p4-fixture-only
    volumes: [temporal-pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, temporal]
      interval: 1s
      retries: 45
    networks: [isolated]
  temporal:
    image: temporalio/auto-setup@sha256:e9245820522233ec6a59ad69c6512ae4450705ee02bf6894fc61ba13b238c1c0
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: p4-fixture-only
    depends_on:
      temporal-postgres: {condition: service_healthy}
    networks: [isolated]
  native-restore:
    image: hpagent/hindsight-pgroonga@sha256:a008bbd49808d2b3574fb7bae19855deeab10093c982ba4a3b53ec1fb95070fa
    pull_policy: never
    environment:
      POSTGRES_USER: pgroonga_fixture
      POSTGRES_PASSWORD: pgroonga-fixture-only
      POSTGRES_DB: p4_native_restore
    volumes: [native-restore:/var/lib/postgresql/data]
    networks: [isolated]
  candidate-restore:
    image: hpagent/hindsight-pgroonga@sha256:a008bbd49808d2b3574fb7bae19855deeab10093c982ba4a3b53ec1fb95070fa
    pull_policy: never
    environment:
      POSTGRES_USER: pgroonga_fixture
      POSTGRES_PASSWORD: pgroonga-fixture-only
      POSTGRES_DB: p4_candidate_restore
    volumes: [candidate-restore:/var/lib/postgresql/data]
    networks: [isolated]
  app-restore:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: hpagent_migration
      POSTGRES_PASSWORD: fixture-only
      POSTGRES_DB: hpagent_pgroonga_test
    volumes:
      - app-restore:/var/lib/postgresql/data
      - ./application-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    networks: [isolated]
  embeddings:
    image: ghcr.io/vectorize-io/hindsight:1.1.0@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06
    profiles: [restore-api]
    entrypoint: [/app/api/.venv/bin/python, /fixture.py]
    volumes: [../hindsight_embeddings.py:/fixture.py:ro]
    networks: [isolated]
  native-api:
    image: ghcr.io/vectorize-io/hindsight:1.1.0@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06
    profiles: [restore-api]
    environment: &restore-env
      HINDSIGHT_ENABLE_CP: 'false'
      HINDSIGHT_API_DATABASE_URL: postgresql://pgroonga_fixture:pgroonga-fixture-only@native-restore:5432/p4_native_restore
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: native
      HINDSIGHT_API_LLM_PROVIDER: mock
      HINDSIGHT_API_LLM_MODEL: mock-model
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://embeddings:8181/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: fixture-only
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: g1-fixture
      HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: '384'
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: 'true'
      HINDSIGHT_API_CONSOLIDATION_RECONCILE_INTERVAL_SECONDS: '1'
    volumes: [.:/p1-fixture:ro]
    networks: [isolated]
  candidate-api:
    image: ghcr.io/vectorize-io/hindsight:1.1.0@sha256:50311d02b4d5d2b7c5242bd336edf8735df8374eaad496a92f49c83b37d2aa06
    profiles: [restore-api]
    environment:
      <<: *restore-env
      HINDSIGHT_API_DATABASE_URL: postgresql://pgroonga_fixture:pgroonga-fixture-only@candidate-restore:5432/p4_candidate_restore
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: pgroonga
    volumes: [.:/p1-fixture:ro]
    networks: [isolated]
volumes:
  temporal-pgdata:
  native-restore:
  candidate-restore:
  app-restore:
networks:
  isolated:
    internal: true
