services:

  # ============================================================
  # 基础设施层
  #
  # 无 profile：
  #   docker compose up -d
  #
  # 即可长期运行。
  #
  # 日常修改 hpagent / web 源码时，不需要重启这些服务。
  # ============================================================

  # ==================== App PostgreSQL ====================
  app-postgres:
    image: postgres:16-alpine

    environment:
      TZ: UTC
      POSTGRES_USER: hpagent_migrate
      POSTGRES_PASSWORD: ${HPAGENT_MIGRATE_PASSWORD:-hpagent_migrate}
      POSTGRES_DB: hpagent

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - app-pgdata:/var/lib/postgresql/data
      - ./persistence/docker-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hpagent_migrate -d hpagent"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - app-network

    restart: unless-stopped


  # ==================== Redis ====================
  redis:
    image: redis:7-alpine

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - TZ=Asia/Shanghai

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app-network

    restart: unless-stopped


  # ==================== Temporal PostgreSQL ====================
  temporal-postgres:
    image: postgres:16-alpine

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal

    volumes:
      - temporal-pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U temporal -d temporal"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - app-network

    restart: unless-stopped


  # ==================== Temporal Server ====================
  temporal:
    image: temporalio/auto-setup:1.26.2

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    environment:
      - TZ=Asia/Shanghai
      - BIND_ON_IP=0.0.0.0
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres

    ports:
      - "127.0.0.1:7233:7233"

    depends_on:
      temporal-postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "tctl",
          "--address",
          "localhost:7233",
          "cluster",
          "health"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

    networks:
      - app-network

    restart: unless-stopped


  # ==================== Hindsight PostgreSQL ====================
  hindsight-postgres:
    image: pgvector/pgvector:pg16

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: hindsight
      POSTGRES_DB: hindsight

    command: >
      -c shared_buffers=128MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=256MB
      -c wal_buffers=16MB
      -c max_wal_size=1GB

    volumes:
      - hindsight-pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hindsight -d hindsight"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    deploy:
      resources:
        limits:
          memory: 512m

    networks:
      - app-network

    restart: unless-stopped


  # ==================== Hindsight ====================
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.6.1

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    environment:
      - TZ=Asia/Shanghai

      # PostgreSQL
      - HINDSIGHT_API_DATABASE_URL=postgresql://hindsight:hindsight@hindsight-postgres:5432/hindsight

      # LLM
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_API_LLM_PROVIDER}
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_API_LLM_BASE_URL}
      - HINDSIGHT_API_LLM_API_KEY=${HINDSIGHT_API_LLM_API_KEY}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_API_LLM_MODEL}

      # Embedding
      - HINDSIGHT_API_EMBEDDINGS_PROVIDER=openai
      - HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY=${SILICONFLOW_API_KEY}
      - HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL=${SILICONFLOW_EMBEDDING_MODEL}
      - HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL=${SILICONFLOW_BASE_URL}

      # Reranker
      - HINDSIGHT_API_RERANKER_PROVIDER=siliconflow
      - HINDSIGHT_API_RERANKER_SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - HINDSIGHT_API_RERANKER_SILICONFLOW_MODEL=${SILICONFLOW_RERANK_MODEL}
      - HINDSIGHT_API_RERANKER_SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL}

      - HINDSIGHT_API_SKIP_LLM_VERIFICATION=true

    ports:
      - "127.0.0.1:8001:8888"
      - "127.0.0.1:9999:9999"

    volumes:
      - ./scripts/start-all.sh:/app/start-all.sh:ro

    depends_on:
      hindsight-postgres:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 1g

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8888/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - app-network

    restart: unless-stopped


  # ============================================================
  # 数据库 Migration
  #
  # 会随 agent / web / web-prod 启动。
  #
  # src 和 persistence 都直接挂载，
  # 修改 Python migration 或 SQL 后无需 rebuild。
  # ============================================================

  hpagent-migrate:
    profiles:
      - agent
      - web
      - web-prod

    build:
      context: .
      dockerfile: src/Dockerfile.migrate

    environment:
      APP_DATABASE_URL: postgresql://hpagent_migrate:${HPAGENT_MIGRATE_PASSWORD:-hpagent_migrate}@app-postgres:5432/hpagent

    volumes:
      - ./src:/app/src:ro
      - ./persistence:/app/persistence:ro

    depends_on:
      app-postgres:
        condition: service_healthy

    networks:
      - app-network

    restart: "no"


  # ============================================================
  # HpAgent 主程序
  #
  # profiles:
  #
  #   agent
  #       只启动 Agent
  #
  #   web
  #       Web 开发模式
  #
  #   web-prod
  #       Web 生产模式
  #
  # ./src -> /app
  #
  # 所以修改 Python 源码：
  #
  #   docker compose restart hpagent
  #
  # 不需要 build。
  # ============================================================

  hpagent:
    profiles:
      - agent
      - web
      - web-prod

    build:
      context: ./src

    ports:
      - "127.0.0.1:8082:8082"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    environment:
      # 基础设施
      - TZ=Asia/Shanghai
      - TEMPORAL_HOST=temporal:7233
      - HINDSIGHT_URL=http://hindsight:8888
      - REDIS_URL=redis://redis:6379

      # Workspace
      - WORKSPACE_ROOT=/app/.data/workspace
      - WORKSPACE_ISOLATION_MODE=${WORKSPACE_ISOLATION_MODE:-single_process_account_lock}

      # Web real-Agent
      - WORKER_DATABASE_URL=postgresql://hpagent_worker:${HPAGENT_WORKER_PASSWORD:-hpagent_worker}@app-postgres:5432/hpagent
      - WEB_REAL_AGENT_ENABLED=${WEB_REAL_AGENT_ENABLED:-true}
      - WEB_REAL_AGENT_GATE_VERSION=c-07-v1
      - DURABLE_AGENT_ENABLED=${DURABLE_AGENT_ENABLED:-false}
      - AGENT_EXECUTION_LEASE_TTL_SECONDS=${AGENT_EXECUTION_LEASE_TTL_SECONDS:-900}

      # Unified identity
      - HPAGENT_ENV=${HPAGENT_ENV:-development}
      - QQ_BINDING_CODE_PEPPER=${QQ_BINDING_CODE_PEPPER:-development-qq-binding-code-pepper}
      - QQ_BINDING_CHALLENGE_SECONDS=${QQ_BINDING_CHALLENGE_SECONDS:-300}

      # SiliconFlow
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL}
      - SILICONFLOW_EMBEDDING_MODEL=${SILICONFLOW_EMBEDDING_MODEL}
      - SILICONFLOW_RERANK_MODEL=${SILICONFLOW_RERANK_MODEL}
      - SILICONFLOW_DeepSeek_R1_0528_Qwen3_8B_MODEL=${SILICONFLOW_DeepSeek_R1_0528_Qwen3_8B_MODEL}

      # Alibaba Bailian
      - ALIBABA_BAILIAN_API_KEY=${ALIBABA_BAILIAN_API_KEY}
      - ALIBABA_BAILIAN_BASE_URL=${ALIBABA_BAILIAN_BASE_URL}
      - ALIBABA_BAILIAN_FAST_MODEL=${ALIBABA_BAILIAN_FAST_MODEL}

      # MiniMax
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_API_BASE_URL=${MINIMAX_API_BASE_URL}
      - MINIMAX_STANDARD_MODEL=${MINIMAX_STANDARD_MODEL}
      - MINIMAX_FLAGSHIP_MODEL=${MINIMAX_FLAGSHIP_MODEL}
      - MINIMAX_HIGHSPEED_MODEL=${MINIMAX_HIGHSPEED_MODEL}

      # QQ Official
      - QQ_OFFICIAL_APP_ID=${QQ_OFFICIAL_APP_ID:-}
      - QQ_OFFICIAL_CLIENT_SECRET=${QQ_OFFICIAL_CLIENT_SECRET:-}
      - QQ_OFFICIAL_SANDBOX=${QQ_OFFICIAL_SANDBOX:-false}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      # --------------------------------------------------------
      # 核心：
      # 本地 src 直接覆盖镜像里的 /app。
      #
      # 改 Python 源码以后只需要 restart，
      # 不需要重新 docker build。
      # --------------------------------------------------------
      - ./src:/app

      # Runtime Data
      - ./.data:/app/.data

      # Configuration
      - ./config:/app/config:ro

      # Tool definitions / MCP / ChromaDB
      - ./tools:/app/tools

    depends_on:
      app-postgres:
        condition: service_healthy

      hpagent-migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      temporal:
        condition: service_healthy

      hindsight:
        condition: service_healthy

    networks:
      - app-network

    restart: unless-stopped


  # ============================================================
  # FastAPI
  #
  # ./src -> /app/src
  #
  # 修改 API Python 源码：
  #
  #   docker compose restart hpagent-api
  #
  # 无需 rebuild。
  # ============================================================

  hpagent-api:
    profiles:
      - web
      - web-prod

    build:
      context: .
      dockerfile: src/Dockerfile.web-api

    environment:
      TZ: UTC

      REDIS_URL: redis://redis:6379

      HPAGENT_ENV: ${HPAGENT_ENV:-development}

      APP_DATABASE_URL: postgresql://hpagent_api:${HPAGENT_API_PASSWORD:-hpagent_api}@app-postgres:5432/hpagent

      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-https://localhost}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}

      WEB_CURSOR_ACTIVE_KEY_ID: ${WEB_CURSOR_ACTIVE_KEY_ID:-v1}
      WEB_CURSOR_SECRET: ${WEB_CURSOR_SECRET:-development-cursor-secret}

      WEB_SESSION_TOKEN_PEPPER: ${WEB_SESSION_TOKEN_PEPPER:-development-session-token-pepper}
      WEB_CSRF_SIGNING_KEY: ${WEB_CSRF_SIGNING_KEY:-development-csrf-key}

      QQ_BINDING_CODE_PEPPER: ${QQ_BINDING_CODE_PEPPER:-development-qq-binding-code-pepper}
      QQ_BINDING_CHALLENGE_SECONDS: ${QQ_BINDING_CHALLENGE_SECONDS:-300}

      WEB_CREDENTIALS_JSON: ${WEB_CREDENTIALS_JSON:-{}}

      WEB_FAKE_EXECUTOR_ENABLED: "false"

      DURABLE_AGENT_ENABLED: ${DURABLE_AGENT_ENABLED:-false}

      LOG_DIR: /app/.data/logs

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      # Python API 源码直接挂载
      - ./src:/app/src:ro

      # API 写 web-api.jsonl / web-api-error.log；宿主机可直接联合查询
      - ./.data:/app/.data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

    depends_on:
      app-postgres:
        condition: service_healthy

      hpagent-migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    networks:
      - app-network

    restart: unless-stopped


  # ============================================================
  # Web 开发模式
  #
  # profile: web
  #
  # React/Vite：
  # ./web -> /app
  #
  # Vite HMR：
  # 修改 ts / tsx / css 后浏览器自动更新。
  #
  # 不需要 restart
  # 不需要 build
  # ============================================================

  web-dev:
    profiles:
      - web

    image: node:22-bookworm-slim  # node:20-alpine

    working_dir: /app

    environment:
      TZ: Asia/Shanghai

      # 容器内部通过 Docker DNS 访问 FastAPI
      HPAGENT_API_TARGET: http://hpagent-api:8080

    command:
      - sh
      - -c
      - |
        if [ ! -x node_modules/.bin/vite ]; then
          npm ci
        fi
        exec npm run dev -- --host 0.0.0.0

    ports:
      - "5173:5173"

    volumes:
      # Web 源码实时挂载
      - ./web:/app

      # node_modules 不放到宿主机，
      # 避免 WSL / Linux / Windows Node 环境相互污染
      - web-node-modules:/app/node_modules

    depends_on:
      hpagent-api:
        condition: service_healthy

    networks:
      - app-network

    restart: unless-stopped


  # ============================================================
  # Web 生产模式
  #
  # profile: web-prod
  #
  # React -> npm build -> nginx
  #
  # 这个服务仍然是标准生产镜像，
  # 前端源码变化时需要重新 build。
  # ============================================================

  web-gateway:
    profiles:
      - web-prod

    build:
      context: ./web

    environment:
      TZ: UTC

    ports:
      - "${WEB_GATEWAY_PORT:-80}:80"

    depends_on:
      hpagent-api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - app-network

    restart: unless-stopped


  # ============================================================
  # NapCat QQ
  #
  # 只保留直连模式。
  #
  # 启动：
  #
  #   docker compose --profile qq up -d napcat
  #
  # ============================================================

  napcat:
    profiles:
      - qq

    image: mlikiowa/napcat-docker:latest

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    network_mode: host

    environment:
      - NAPCAT_UID=2000
      - NAPCAT_GID=2000
      - TZ=Asia/Shanghai

      - ACCOUNT=${NAPCAT_ACCOUNT}
      - NAPCAT_QUICK_PASSWORD=${NAPCAT_QUICK_PASSWORD}

      - ENABLE_VNC=false
      - ELECTRON_DISABLE_GPU=1

    volumes:
      - ./.data/napcat/QQ:/app/.config/QQ
      - ./.data/napcat/data:/app/.napcat
      - ./.data/napcat/cache:/app/data/cache
      - ./.data/napcat/config:/app/napcat/config

    restart: unless-stopped


  # ============================================================
  # Temporal UI
  #
  # 非核心基础设施。
  #
  # 按需启动：
  #
  #   docker compose --profile tools up -d temporal-web
  #
  # ============================================================

  temporal-web:
    profiles:
      - tools

    image: temporalio/ui:2.34.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - TZ=Asia/Shanghai
      - TEMPORAL_ADDRESS=temporal:7233

    ports:
      - "127.0.0.1:8088:8088"

    depends_on:
      temporal:
        condition: service_healthy

    networks:
      - app-network

    restart: unless-stopped


# ============================================================
# Persistent Volumes
# ============================================================

volumes:

  # App PostgreSQL
  app-pgdata:

  # Temporal PostgreSQL
  temporal-pgdata:

  # Hindsight PostgreSQL
  hindsight-pgdata:

  # Redis
  redis-data:

  # Web dev node_modules
  web-node-modules:


# ============================================================
# Network
# ============================================================

networks:

  app-network:
    driver: bridge
